<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidan hittades inte – Ett Steg I Taget</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f4efe3;
      color: #1A1A1A;
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      text-align: center;
      max-width: 480px;
    }
    img { height: 56px; width: auto; margin: 0 auto 32px; }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 300;
      line-height: 1.15;
      margin-bottom: 16px;
      color: #1B4332;
    }
    p {
      font-size: .95rem;
      color: #4A4A4A;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    a.btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; border-radius: 100px;
      background: #2D6A4F; color: #fff;
      font-size: .9rem; font-weight: 600;
      text-decoration: none;
      transition: background .25s ease, transform .25s ease;
    }
    a.btn:hover { background: #1B4332; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="Logga-Ett Steg I Taget.png" alt="Ett Steg I Taget" />
    <h1>Den här sidan finns inte</h1>
    <p>Det verkar som att länken är fel eller att sidan har flyttats. Gå tillbaka till startsidan så hjälper vi dig vidare.</p>
    <a href="/" class="btn">← Till startsidan</a>
  </div>
</body>
</html>
